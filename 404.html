<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Ashraf Hany</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#191814">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container-site d-flex align-items-center justify-content-between" style="min-height: var(--header-h)">
      <a href="/" aria-label="Ashraf Hany — home"><img src="/assets/brand/logo-header.svg" alt="Ashraf Hany" width="152" height="30" style="height:30px;width:auto"></a>
      <a class="mono" href="/">← Back home</a>
    </div>
  </header>

  <main class="error-page">
    <div class="container-site">
      <span class="eyebrow mono">GET <span data-path>/this-page</span> → 404 Not Found</span>
      <h1 class="error-page__title">This route <em>doesn't exist.</em></h1>
      <p class="error-page__text">The page you're looking for was moved or never shipped. Everything I've built is on the home page.</p>
      <div class="d-flex flex-wrap gap-4 mono">
        <a class="link-underline" href="/">Go to the home page</a>
        <a class="link-underline" href="/#work">See my work</a>
        <a class="link-underline" href="/#contact">Contact me</a>
      </div>
    </div>
  </main>

  <script>
    var el = document.querySelector("[data-path]");
    if (el) el.textContent = location.pathname;
  </script>
</body>
</html>
